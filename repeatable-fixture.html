<!doctype html>
<html lang="zh-CN" data-qiuzhao-repeatable-fixture="feishu-recruiting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重复经历安全创建回归页</title>
    <style>
      :root {
        color: #606c38;
        background: #e8dcc7;
        font-family: Epilogue, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { max-width: 1060px; margin: 0 auto; padding: 42px 24px 80px; }
      header { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: end; margin-bottom: 28px; }
      .eyebrow { margin: 0 0 8px; color: #c66b3d; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 0; font-size: clamp(38px, 6vw, 68px); line-height: .96; letter-spacing: -.055em; }
      .intro { margin: 0; padding: 22px; background: #8b9d83; color: #e8dcc7; border-radius: 28px; line-height: 1.6; }
      #audit-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
      .status-card { padding: 15px; background: #c08e3a; color: #e8dcc7; border-radius: 20px; }
      .status-card strong { display: block; margin-bottom: 5px; font-size: 14px; }
      .status-card span { font-size: 11px; }
      form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      section { position: relative; padding: 24px; background: #b08b6e; border-radius: 28px; }
      section h2 { margin: 0 0 16px; font-size: 22px; }
      .records { display: grid; gap: 10px; }
      .record { display: grid; gap: 9px; padding: 14px; background: #e8dcc7; border-radius: 18px; }
      .atsx-form-item { display: grid; gap: 5px; }
      .atsx-form-item-label { font-size: 10px; font-weight: 800; }
      input, textarea { width: 100%; min-height: 38px; padding: 9px 11px; color: #606c38; background: #e8dcc7; border: 1px solid #8b9d83; border-radius: 14px; }
      textarea { min-height: 72px; resize: vertical; }
      .section-actions { display: flex; gap: 9px; margin-top: 14px; }
      button { min-height: 38px; padding: 9px 14px; color: #e8dcc7; background: #606c38; border: 0; border-radius: 16px; font-weight: 800; cursor: pointer; }
      .delete-record { color: #606c38; background: #e8dcc7; }
      #submit-control { grid-column: 1 / -1; justify-self: end; background: #c66b3d; }
      #event-log { margin-top: 24px; padding: 18px 22px; background: #8b9d83; color: #e8dcc7; border-radius: 24px; font-size: 12px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Xiaomi-derived local regression</p>
        <h1>缺失经历，逐条创建。</h1>
      </div>
      <p class="intro">每次只触发对应分区的唯一添加控件，并在下一次点击前重新核对行数、序号、URL 与控件指纹。</p>
    </header>
    <div id="audit-status" aria-live="polite"></div>
    <form id="repeatable-form">
      <section class="resumeEditForm-education" data-group="education">
        <h2>教育经历</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="formOperate-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <section class="resumeEditForm-internship" data-group="workExperiences">
        <h2>实习经历</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="createFormSection-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <section class="resumeEditForm-work" data-group="workSamples">
        <h2>作品</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="createFormSection-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <section class="resumeEditForm-project" data-group="projects">
        <h2>项目经历</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="formOperate-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <section class="resumeEditForm-award" data-group="awards">
        <h2>获奖经历</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="createFormSection-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <section class="resumeEditForm-language" data-group="languages">
        <h2>语言能力</h2><div class="records"></div>
        <div class="section-actions"><button type="button" class="createFormSection-addBtn">添加</button><button type="button" class="delete-record">删除</button></div>
      </section>
      <button id="submit-control" type="submit">最终提交（测试中永不触发）</button>
    </form>
    <div id="event-log">等待本地安全创建回归。</div>
    <script type="module" src="/src/fixture/repeatable-main.ts"></script>
  </body>
</html>
